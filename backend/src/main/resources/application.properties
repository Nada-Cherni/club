spring.application.name=club

# Serveur web
server.servlet.context-path=/isi-clubs
server.port=8082

# Configuration Swagger
# http://localhost:8082/isi-clubs/docs
springdoc.swagger-ui.path=/docs

# Connexion MySQL (WampServer)
spring.datasource.url=jdbc:mysql://localhost:3306/club?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuration Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect